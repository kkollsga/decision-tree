        }

        function copyNodeTo(sourceId, targetId) {
            const sourceNode = treeData.nodes[sourceId];
            const targetNode = treeData.nodes[targetId];
            if (!sourceNode || !targetNode) return;
            
            targetNode.name = sourceNode.name;
            targetNode.type = sourceNode.type;
            
            targetNode.branches.forEach(branch => {
                if (branch.childId) deleteNodeRecursive(branch.childId);
            });
            
            targetNode.branches = sourceNode.branches.map(branch => {
                const newBranch = { ...branch, id: generateId('branch') };
                if (branch.childId) {
                    newBranch.childId = deepCopyNode(branch.childId);
                }
                return newBranch;
            });
            
            saveCurrentProject();
            layoutTree();
            renderTree();
            closeEditPanel();
            setTimeout(fitToView, 50);
        }

        function deepCopyNode(nodeId) {
            const node = treeData.nodes[nodeId];
            if (!node) return null;
            
            const newId = generateId('node');
            const newNode = {
                id: newId,
                name: node.name,
                type: node.type,
                branches: [],
                x: 0,
                y: 0
            };
            
            newNode.branches = node.branches.map(branch => {
                const newBranch = { ...branch, id: generateId('branch') };
                if (branch.childId) {
                    newBranch.childId = deepCopyNode(branch.childId);
                }
                return newBranch;
            });
            
            treeData.nodes[newId] = newNode;
            return newId;
        }

        // ============ NODE & BRANCH OPERATIONS ============

        function addBranchToSelected() {
            if (!selectedNode) return;
            addBranch(selectedNode);
        }

        function addBranch(nodeId) {
            const node = treeData.nodes[nodeId];
            if (node.type === 'end') return;
            
            const branchId = generateId('branch');
            const endId = generateId('node');
            
            treeData.nodes[endId] = {
                id: endId,
                name: "End",
                type: "end",
                branches: [],
                x: 0,
                y: 0
            };
            
            const newBranch = {
                id: branchId,
                name: `Option ${node.branches.length + 1}`,
                value: 0,
                childId: endId
            };

            if (node.type === 'chance' || node.type === 'logic') {
                newBranch.probability = 0;
            }
            if (node.type === 'logic') {
                newBranch.logic = "";
            }

            node.branches.push(newBranch);
            saveCurrentProject();
            layoutTree();
            renderTree();
            updateBranchCard(nodeId);
            setTimeout(fitToView, 50);
        }

        function createNodeAtBranch(parentId, branchIndex, type = "end") {
            const id = generateId('node');
            const parentNode = treeData.nodes[parentId];
            
            treeData.nodes[id] = {
                id: id,
                name: type === 'end' ? 'End' : type.charAt(0).toUpperCase() + type.slice(1),
                type: type,
                branches: [],
                x: 0,
                y: 0
            };

            parentNode.branches[branchIndex].childId = id;
            saveCurrentProject();
            layoutTree();
            renderTree();
            selectNode(id);
            setTimeout(fitToView, 50);
        }

        function updateNodeFromForm() {
            if (!selectedNode) return;
            const node = treeData.nodes[selectedNode];
            
            const nameInput = document.getElementById('nodeNameInput');
            const typeSelect = document.getElementById('nodeTypeSelect');
            
            if (nameInput) node.name = nameInput.value;
            
            if (typeSelect && typeSelect.value !== node.type) {
                const oldType = node.type;
                const newType = typeSelect.value;
                
                // Cache current branch properties if switching FROM chance/logic and not already cached
                // (We want to preserve values set during this edit session too)
                if ((oldType === 'chance' || oldType === 'logic') && node.branches.length > 0) {
                    // Update cache with current values (user may have edited them)
                    branchPropsCache[selectedNode] = node.branches.map(b => ({
                        id: b.id,
                        probability: b.probability,
                        logic: b.logic
                    }));
                }
                
                if (newType === 'end') {
                    if (node.branches.length > 0) {
                        branchCache[selectedNode] = {
                            branches: JSON.parse(JSON.stringify(node.branches)),
                            previousType: oldType
                        };
                    }
                    node.branches.forEach(b => {
                        if (b.childId) hideNodeRecursive(b.childId);
                    });
                    node.branches = [];
                } else {
                    if (oldType === 'end' && branchCache[selectedNode]) {
                        const cached = branchCache[selectedNode];
                        node.branches = cached.branches;
                        node.branches.forEach(b => {
                            if (b.childId) showNodeRecursive(b.childId);
                        });
                        delete branchCache[selectedNode];
                    }

                    // Auto-populate branches if changing to non-end type and currently empty
                    if (node.branches.length === 0 && newType !== 'end') {
                        // Create end nodes for the branches
                        const endNode1Id = generateId('node');
                        const endNode2Id = generateId('node');

                        treeData.nodes[endNode1Id] = {
                            id: endNode1Id,
                            name: "End",
                            type: "end",
                            branches: [],
                            x: 0,
                            y: 0
                        };

                        treeData.nodes[endNode2Id] = {
                            id: endNode2Id,
                            name: "End",
                            type: "end",
                            branches: [],
                            x: 0,
                            y: 0
                        };

                        node.branches = [
                            {
                                id: generateId('branch'),
                                name: 'Branch 1',
                                probability: newType === 'chance' ? 50 : undefined,
                                logic: newType === 'logic' ? '' : undefined,
                                value: 0,
                                childId: endNode1Id
                            },
                            {
                                id: generateId('branch'),
                                name: 'Branch 2',
                                probability: newType === 'chance' ? 50 : undefined,
                                logic: newType === 'logic' ? '' : undefined,
                                value: 0,
                                childId: endNode2Id
                            }
                        ];
                    }

                    // Update branch properties for new type
                    node.branches.forEach(branch => {
                        if (newType === 'chance' || newType === 'logic') {
                            // Try to restore cached probability
                            if (branch.probability === undefined) {
                                const cachedProps = branchPropsCache[selectedNode];
                                const cached = cachedProps?.find(c => c.id === branch.id);
                                branch.probability = cached?.probability ?? 0;
                            }
                        }
                        if (newType === 'logic') {
                            // Try to restore cached logic
                            if (branch.logic === undefined) {
                                const cachedProps = branchPropsCache[selectedNode];
                                const cached = cachedProps?.find(c => c.id === branch.id);
                                branch.logic = cached?.logic ?? "";
                            }
                        }
                        if (newType === 'decision') {
                            // Don't delete, just don't display - values preserved in cache
                            delete branch.probability;
                            delete branch.logic;
                        }
                    });
                }
                node.type = newType;
                layoutTree();
                renderTree();
                showNodeEditPanel(selectedNode);
                return;
            }
            
            renderTree();
        }

        function updateBranchField(nodeId, branchIndex, field, value) {
            const node = treeData.nodes[nodeId];
            if (!node || !node.branches[branchIndex]) return;
            
            const input = event ? event.target : null;
            
            try {
                if (field === 'probability' || field === 'value') {
                    value = parseNumber(value);
                }
                node.branches[branchIndex][field] = value;
                if (input) {
                    input.classList.remove('error');
                    const errorEl = input.parentElement.querySelector('.error-message');
                    if (errorEl) errorEl.remove();
                }
                renderTree();
                updateBranchSum(nodeId);
            } catch (e) {
                if (input) {
                    input.classList.add('error');
                    let errorEl = input.parentElement.querySelector('.error-message');
                    if (!errorEl) {
                        errorEl = document.createElement('div');
                        errorEl.className = 'error-message';
                        input.parentElement.appendChild(errorEl);
                    }
                    errorEl.textContent = e.message;
                }
            }
        }

        function updateBranchSum(nodeId) {
            const node = treeData.nodes[nodeId];
            if (!node || (node.type !== 'chance' && node.type !== 'logic')) return;
            
            const sum = node.branches.reduce((s, b) => s + (b.probability || 0), 0);
            const sumEl = document.getElementById('branchSumValue');
            if (sumEl) {
                sumEl.textContent = sum.toFixed(1) + ' %';
                sumEl.className = 'branch-sum-value ' + (Math.abs(sum - 100) < 0.01 ? 'valid' : 'invalid');
            }
        }

        function hideNodeRecursive(nodeId) {
            const node = treeData.nodes[nodeId];
            if (!node) return;
            node._hidden = true;
            node.branches.forEach(b => {
                if (b.childId) hideNodeRecursive(b.childId);
            });
        }

        function showNodeRecursive(nodeId) {
            const node = treeData.nodes[nodeId];
            if (!node) return;
            delete node._hidden;
            node.branches.forEach(b => {
                if (b.childId) showNodeRecursive(b.childId);
            });
        }

        function applyChanges() {
            if (copyMode) return;
            if (selectedRootBranch) {
                applyRootBranchChanges();
            } else if (selectedNode) {
                applyNodeChanges();
            }
        }

        function applyNodeChanges() {
            if (!selectedNode) return;
            updateNodeFromForm();
            
            const node = treeData.nodes[selectedNode];
            if (node && node.type === 'end' && branchCache[selectedNode]) {
                const cached = branchCache[selectedNode];
                cached.branches.forEach(b => {
                    if (b.childId) deleteNodeRecursive(b.childId);
                });
                delete branchCache[selectedNode];
            }
            
            // Clear caches since changes are confirmed
            delete branchPropsCache[selectedNode];
            originalBranchProps = null;
            
            saveCurrentProject();
            layoutTree();
            renderTree();
            closeEditPanel();
            setTimeout(fitToView, 50);
        }

        function applyRootBranchChanges() {
            const branchNameInput = document.getElementById('rootBranchNameInput');
            const unitInput = document.getElementById('unitInput');
            const branchValueInput = document.getElementById('rootBranchValueInput');
            
            try {
                if (branchNameInput) {
                    const newName = branchNameInput.value.trim();
                    if (!newName) throw new Error('Name cannot be empty');
                    
                    // Check for duplicate project names
                    if (newName !== currentProjectName && projects[newName]) {
                        throw new Error('A project with this name already exists');
                    }
                    
                    // Update project name in storage
                    if (newName !== currentProjectName) {
                        delete projects[currentProjectName];
                        currentProjectName = newName;
                    }
                    
                    treeData.rootBranch.name = newName;
                    treeData.name = newName;
                    updateTitle();
                }
                if (unitInput) treeData.unit = unitInput.value;
                if (branchValueInput) {
                    treeData.rootBranch.value = parseNumber(branchValueInput.value);
                }
                
                saveCurrentProject();
                renderTree();
                closeEditPanel();
            } catch (e) {
                alert(e.message);
            }
        }

        function deleteBranch(nodeId, branchIndex) {
            const node = treeData.nodes[nodeId];
            const branch = node.branches[branchIndex];
            
            if (branch.childId) {
                deleteNodeRecursive(branch.childId);
            }
            
            node.branches.splice(branchIndex, 1);
            saveCurrentProject();
            layoutTree();
            renderTree();
            updateBranchCard(nodeId);
            setTimeout(fitToView, 50);
        }

        function toggleDeleteConfirm(nodeId) {
            const dialog = document.getElementById('deleteConfirmDialog');
            if (dialog) {
                dialog.style.display = dialog.style.display === 'none' ? 'block' : 'none';
            }
        }

        function confirmDeleteNode(nodeId) {
            deleteNode(nodeId);
        }

        function deleteNode(nodeId) {
            const parentInfo = findParent(nodeId);
            
            if (parentInfo) {
                const node = treeData.nodes[nodeId];
                const firstChildId = node.branches.length > 0 ? node.branches[0].childId : null;
                parentInfo.branch.childId = firstChildId;
                
                for (let i = 1; i < node.branches.length; i++) {
                    if (node.branches[i].childId) deleteNodeRecursive(node.branches[i].childId);
                }
                delete treeData.nodes[nodeId];
            } else {
                const node = treeData.nodes[nodeId];
                if (node.branches.length > 0 && node.branches[0].childId) {
                    treeData.rootId = node.branches[0].childId;
                    for (let i = 1; i < node.branches.length; i++) {
                        if (node.branches[i].childId) deleteNodeRecursive(node.branches[i].childId);
                    }
                    delete treeData.nodes[nodeId];
                } else {
                    return;
                }
            }

            saveCurrentProject();
            layoutTree();
            renderTree();
            closeEditPanel();
            setTimeout(fitToView, 50);
        }

        function deleteNodeRecursive(nodeId) {
            const node = treeData.nodes[nodeId];
            if (!node) return;
            node.branches.forEach(branch => {
                if (branch.childId) deleteNodeRecursive(branch.childId);
            });
            delete treeData.nodes[nodeId];
        }

        // ============ CALCULATIONS ============

        function calculateExpectedValue(nodeId) {
            const node = treeData.nodes[nodeId];
            if (!node || node._hidden || node.type === 'end' || node.branches.length === 0) return 0;

            if (node.type === 'chance' || node.type === 'logic') {
                let ev = 0;
                node.branches.forEach(branch => {
                    const childNode = branch.childId ? treeData.nodes[branch.childId] : null;
                    if (childNode && childNode._hidden) return;
                    
                    const prob = (branch.probability || 0) / 100;
                    const branchValue = branch.value || 0;
                    const childEV = branch.childId ? calculateExpectedValue(branch.childId) : 0;
                    ev += prob * (branchValue + childEV);
                });
                return ev;
            }

            if (node.type === 'decision') {
                let maxValue = -Infinity;
                node.branches.forEach(branch => {
                    const childNode = branch.childId ? treeData.nodes[branch.childId] : null;
                    if (childNode && childNode._hidden) return;
                    
                    const branchValue = branch.value || 0;
                    const childEV = branch.childId ? calculateExpectedValue(branch.childId) : 0;
                    maxValue = Math.max(maxValue, branchValue + childEV);
                });
                return maxValue === -Infinity ? 0 : maxValue;
            }
            return 0;
        }

        function calculateEndNodeStats(nodeId) {
            function findPath(currentId, targetId, prob, value) {
                if (currentId === targetId) {
                    return { prob, value };
                }
                const node = treeData.nodes[currentId];
                if (!node || node._hidden) return null;
                
                for (const branch of node.branches) {
                    if (branch.childId) {
                        const childNode = treeData.nodes[branch.childId];
                        if (childNode && childNode._hidden) continue;
                        
                        let newProb = prob;
                        if (node.type === 'chance' || node.type === 'logic') {
                            newProb = prob * (branch.probability || 0) / 100;
                        }
                        const newValue = value + (branch.value || 0);
                        const result = findPath(branch.childId, targetId, newProb, newValue);
                        if (result) return result;
                    }
                }
                return null;
            }
            
            const result = findPath(treeData.rootId, nodeId, 100, treeData.rootBranch.value || 0);
            return result || { prob: 0, value: 0 };
        }

        // ============ LAYOUT & RENDERING ============

        // ============ LAYOUT HELPERS ============
        function getNodeCenter(node) {
            return {
                x: node.x + MARKER_SIZE / 2,
                y: node.y + MARKER_SIZE / 2
            };
        }

        function getSiblingSpacing(orientation) {
            return treeSettings[orientation].branchGap * MARKER_SIZE;
        }

        function getRootBranchEnd(orientation) {
            const rootNode = treeData.nodes[treeData.rootId];
            const center = getNodeCenter(rootNode);
            if (orientation === 'vertical') {
                return ROOT_X + treeSettings.vertical.nodeGap + treeSettings.vertical.branchLength;
            } else {
                return center.x;
            }
        }

        function layoutTree() {
            if (!treeData.rootId) return;

            if (treeData.orientation === 'vertical') {
                layoutTreeVertical();
            } else {
                layoutTreeHorizontal();
            }
        }

        function layoutTreeHorizontal() {
            if (!treeData.rootId) return;

            function getSubtreeHeight(nodeId) {
                const node = treeData.nodes[nodeId];
                if (!node || node._hidden || node.branches.length === 0) return MARKER_SIZE;

                let totalHeight = 0;
                node.branches.forEach((branch, i) => {
                    const childNode = branch.childId ? treeData.nodes[branch.childId] : null;
                    if (childNode && !childNode._hidden) {
                        totalHeight += getSubtreeHeight(branch.childId);
                    } else {
                        totalHeight += MARKER_SIZE;
                    }
                    if (i < node.branches.length - 1) totalHeight += getSiblingSpacing('horizontal');
                });
                return Math.max(totalHeight, MARKER_SIZE);
            }

            function positionNode(nodeId, x, y) {
                const node = treeData.nodes[nodeId];
                if (!node || node._hidden) return;

                node.x = x;
                node.y = y;

                if (node.branches.length === 0) return;

                const subtreeHeight = getSubtreeHeight(nodeId);
                let currentY = y - subtreeHeight / 2 + MARKER_SIZE / 2;

                node.branches.forEach((branch) => {
                    const childNode = branch.childId ? treeData.nodes[branch.childId] : null;
                    if (childNode && !childNode._hidden) {
                        const childHeight = getSubtreeHeight(branch.childId);
                        positionNode(branch.childId, x + treeSettings.horizontal.branchLength, currentY + childHeight / 2 - MARKER_SIZE / 2);
                        currentY += childHeight + getSiblingSpacing('horizontal');
                    } else {
                        currentY += MARKER_SIZE + getSiblingSpacing('horizontal');
                    }
                });
            }

            const treeHeight = getSubtreeHeight(treeData.rootId);
            const startY = Math.max(100, treeHeight / 2 + 50);
            // Position root at the end of the branch line (same as normal branches)
            // Branch structure: nodeGap (before branch) + branchLength (branch section)
            positionNode(treeData.rootId, ROOT_X + treeSettings.horizontal.nodeGap + treeSettings.horizontal.branchLength, startY);
        }

        function layoutTreeVertical() {
            if (!treeData.rootId) return;

            function getSubtreeWidth(nodeId) {
                const node = treeData.nodes[nodeId];
                if (!node || node._hidden || node.branches.length === 0) return MARKER_SIZE;

                let totalWidth = 0;
                node.branches.forEach((branch, i) => {
                    const childNode = branch.childId ? treeData.nodes[branch.childId] : null;
                    if (childNode && !childNode._hidden) {
                        totalWidth += getSubtreeWidth(branch.childId);
                    } else {
                        totalWidth += MARKER_SIZE;
                    }
                    if (i < node.branches.length - 1) totalWidth += getSiblingSpacing('vertical');
                });
                return Math.max(totalWidth, MARKER_SIZE);
            }

            function positionNode(nodeId, x, y) {
                const node = treeData.nodes[nodeId];
                if (!node || node._hidden) return;

                node.x = x;
                node.y = y;

                if (node.branches.length === 0) return;

                const subtreeWidth = getSubtreeWidth(nodeId);
                let currentX = x - subtreeWidth / 2 + MARKER_SIZE / 2;

                node.branches.forEach((branch) => {
                    const childNode = branch.childId ? treeData.nodes[branch.childId] : null;
                    if (childNode && !childNode._hidden) {
                        const childWidth = getSubtreeWidth(branch.childId);
                        // Position child directly at branch end using configured vertical spacing
                        positionNode(branch.childId, currentX + childWidth / 2 - MARKER_SIZE / 2, y + treeSettings.vertical.nodeGap + treeSettings.vertical.branchLength);
                        currentX += childWidth + getSiblingSpacing('vertical');
                    } else {
                        currentX += MARKER_SIZE + getSiblingSpacing('vertical');
                    }
                });
            }

            const treeWidth = getSubtreeWidth(treeData.rootId);
            const startX = Math.max(100, treeWidth / 2 + 50);
            positionNode(treeData.rootId, startX, ROOT_X + treeSettings.vertical.nodeGap + treeSettings.vertical.branchLength);
        }

        function renderTree() {
            const canvas = document.getElementById('treeCanvas');
            const svg = document.getElementById('connectionsSvg');
            
            Array.from(canvas.children).forEach(child => {
                if (child.id !== 'connectionsSvg') child.remove();
            });
            svg.innerHTML = gradients;
            
            if (!treeData.rootId) return;

            renderRootBranch();
            
            for (const id in treeData.nodes) {
                const node = treeData.nodes[id];
                if (node._hidden) continue;
                node.branches.forEach((branch, index) => renderBranch(node, branch, index));
            }
            
            for (const id in treeData.nodes) {
                const node = treeData.nodes[id];
                if (node._hidden) continue;
                renderNode(node);
            }
            
            let maxX = 0, maxY = 0;
            for (const id in treeData.nodes) {
                const node = treeData.nodes[id];
                if (node._hidden) continue;
                maxX = Math.max(maxX, node.x + 250);
                maxY = Math.max(maxY, node.y + 100);
            }
            canvas.style.width = Math.max(maxX, 800) + 'px';
            canvas.style.height = Math.max(maxY, 400) + 'px';
            svg.setAttribute('width', Math.max(maxX, 800));
            svg.setAttribute('height', Math.max(maxY, 400));

            renderLegend();
        }

        function renderRootBranch() {
            const svg = document.getElementById('connectionsSvg');
            const canvas = document.getElementById('treeCanvas');
            const rootNode = treeData.nodes[treeData.rootId];

            if (treeData.orientation === 'vertical') {
                // Vertical root branch - same structure as normal branches
                const rootCenter = getNodeCenter(rootNode);
                const startY = ROOT_X + MARKER_SIZE / 2;  // Start from center height, same as normal branches
                const centerX = rootCenter.x;

                // Branch structure: slanted connector + vertical branch + vertical line to node
                const branchStartY = startY + treeSettings.vertical.nodeGap;
                const branchLength = treeSettings.vertical.branchLength;
                const branchEndY = branchStartY + branchLength;

                // Draw path: diagonal from start to branch start, then vertical to node
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${centerX} ${startY} L ${centerX} ${branchStartY} L ${centerX} ${branchEndY} L ${centerX} ${rootCenter.y}`);
                path.setAttribute('stroke', getLineColor(0.4));
                path.setAttribute('stroke-width', '2');
                path.setAttribute('fill', 'none');
                svg.appendChild(path);

                const nameLabel = document.createElement('div');
                nameLabel.className = 'branch-name';
                nameLabel.style.left = (centerX + 4) + 'px';
                nameLabel.style.top = (branchStartY + (branchEndY - branchStartY) / 2 + treeSettings.vertical.branchNameOffset) + 'px';
                nameLabel.textContent = treeData.rootBranch.name;
                nameLabel.onclick = (e) => { e.stopPropagation(); selectRootBranch(); };
                canvas.appendChild(nameLabel);

                if (treeData.rootBranch.value !== 0) {
                    const valLabel = document.createElement('div');
                    valLabel.className = 'branch-val';
                    valLabel.style.left = (centerX + 4) + 'px';
                    valLabel.style.top = (branchEndY - treeSettings.vertical.branchValOffset) + 'px';
                    valLabel.textContent = formatValueNoUnit(treeData.rootBranch.value);
                    canvas.appendChild(valLabel);
                }
            } else {
                // Horizontal root branch - same structure as normal branches
                const rootCenter = getNodeCenter(rootNode);
                const startX = ROOT_X + MARKER_SIZE / 2;
                const startY = rootCenter.y;
                const endX = rootCenter.x;
                const endY = rootCenter.y;

                // Diagonal from node center, then horizontal
                const horizStartX = startX + treeSettings.horizontal.nodeGap;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${startX} ${startY} L ${horizStartX} ${endY} L ${endX} ${endY}`);
                path.setAttribute('stroke', getLineColor(0.4));
                path.setAttribute('stroke-width', '2');
                path.setAttribute('fill', 'none');
                svg.appendChild(path);

                const nameLabel = document.createElement('div');
                nameLabel.className = 'branch-name';
                nameLabel.style.left = (horizStartX + 8) + 'px';
                nameLabel.style.top = (endY - 16) + 'px';
                nameLabel.textContent = treeData.rootBranch.name;
                nameLabel.onclick = (e) => { e.stopPropagation(); selectRootBranch(); };
                canvas.appendChild(nameLabel);

                if (treeData.rootBranch.value !== 0) {
                    const valLabel = document.createElement('div');
                    valLabel.className = 'branch-val';
                    valLabel.style.left = (endX - treeSettings.horizontal.branchValOffset) + 'px';
                    valLabel.style.top = (endY + 4) + 'px';
                    valLabel.style.transform = 'translateX(-100%)';
                    valLabel.textContent = formatValueNoUnit(treeData.rootBranch.value);
                    canvas.appendChild(valLabel);
                }
            }
        }

        function renderBranch(parentNode, branch, branchIndex) {
            if (treeData.orientation === 'vertical') {
                renderBranchVertical(parentNode, branch, branchIndex);
            } else {
                renderBranchHorizontal(parentNode, branch, branchIndex);
            }
        }

        function renderBranchHorizontal(parentNode, branch, branchIndex) {
            const svg = document.getElementById('connectionsSvg');
            const canvas = document.getElementById('treeCanvas');

            const parentCenter = getNodeCenter(parentNode);
            const startX = parentCenter.x;
            const startY = parentCenter.y;

            let endX, endY;
            let hasChild = !!branch.childId;

            if (hasChild) {
                const childNode = treeData.nodes[branch.childId];
                if (childNode._hidden) return;
                const childCenter = getNodeCenter(childNode);
                endX = childCenter.x;
                endY = childCenter.y;
            } else {
                const numBranches = parentNode.branches.length;
                const siblingSpacing = getSiblingSpacing('horizontal');
                const totalHeight = (numBranches - 1) * siblingSpacing;
                endX = parentNode.x + treeSettings.horizontal.branchLength + MARKER_SIZE / 2;
                endY = parentCenter.y - totalHeight / 2 + branchIndex * siblingSpacing;
            }

            // Branch structure: diagonal from node center, then horizontal to child center
            // nodeGap: horizontal distance before horizontal section starts (diagonal width)
            // branchLength: total horizontal distance from parent center to child center
            // Horizontal section length: branchLength - nodeGap
            const horizStartX = startX + treeSettings.horizontal.nodeGap;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M ${startX} ${startY} L ${horizStartX} ${endY} L ${endX} ${endY}`);
            path.setAttribute('stroke', hasChild ? getLineColor(0.3) : getDashedLineColor());
            path.setAttribute('stroke-width', '2');
            path.setAttribute('fill', 'none');
            if (!hasChild) path.setAttribute('stroke-dasharray', '5,5');
            svg.appendChild(path);

            const nameLabel = document.createElement('div');
            nameLabel.className = 'branch-name';
            nameLabel.style.left = (horizStartX + 8) + 'px';
            nameLabel.style.top = (endY - 16) + 'px';
            nameLabel.textContent = branch.name;
            nameLabel.onclick = (e) => { e.stopPropagation(); selectNode(parentNode.id); };
            canvas.appendChild(nameLabel);

            if (hasChild) {
                const showProb = (parentNode.type === 'chance' || parentNode.type === 'logic') && branch.probability !== undefined;
                const showVal = branch.value !== 0;

                if (showProb) {
                    const probLabel = document.createElement('div');
                    probLabel.className = 'branch-prob';
                    probLabel.style.left = (endX - treeSettings.horizontal.branchValOffset) + 'px';
                    probLabel.style.top = (endY - 16) + 'px';
                    probLabel.style.transform = 'translateX(-100%)';
                    probLabel.textContent = (branch.probability || 0) + '%';
                    canvas.appendChild(probLabel);
                }

                if (showVal) {
                    const valLabel = document.createElement('div');
                    valLabel.className = 'branch-val';
                    valLabel.style.left = (endX - treeSettings.horizontal.branchValOffset) + 'px';
                    valLabel.style.top = (endY + 4) + 'px';
                    valLabel.style.transform = 'translateX(-100%)';
                    valLabel.textContent = formatValueNoUnit(branch.value);
                    canvas.appendChild(valLabel);
                }
            }

            if (!hasChild) {
                const hint = document.createElement('div');
                hint.className = 'add-node-hint';
                hint.style.left = (endX - 10) + 'px';
                hint.style.top = (endY - 10) + 'px';
                hint.textContent = '+';
                hint.onclick = (e) => { e.stopPropagation(); showAddNodeMenu(e, parentNode.id, branchIndex); };
                canvas.appendChild(hint);
            }
        }

        function renderBranchVertical(parentNode, branch, branchIndex) {
            const svg = document.getElementById('connectionsSvg');
            const canvas = document.getElementById('treeCanvas');

            const parentCenter = getNodeCenter(parentNode);
            const parentCenterX = parentCenter.x;
            const parentCenterY = parentCenter.y;

            let childX, childY;
            let hasChild = !!branch.childId;

            if (hasChild) {
                const childNode = treeData.nodes[branch.childId];
                if (childNode._hidden) return;
                const childCenter = getNodeCenter(childNode);
                childX = childCenter.x;
                childY = childCenter.y;
            } else {
                const numBranches = parentNode.branches.length;
                const siblingSpacing = getSiblingSpacing('vertical');
                const totalWidth = (numBranches - 1) * siblingSpacing;
                childX = parentCenter.x - totalWidth / 2 + branchIndex * siblingSpacing;
                childY = parentNode.y + treeSettings.vertical.nodeGap + treeSettings.vertical.branchLength;
            }

            // Vertical branch section
            // branchStartY: where slanted connector meets vertical branch (at childX)
            // branchEndY: bottom of vertical branch (where values go)
            const branchStartY = parentCenterY + treeSettings.vertical.nodeGap;
            const branchLength = treeSettings.vertical.branchLength;
            const branchEndY = branchStartY + branchLength;

            // Draw path:
            // 1. Slanted connector from parent center to branch start at childX
            // 2. Vertical branch line (straight down at childX)
            // 3. Vertical line to child (childX to childX)
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M ${parentCenterX} ${parentCenterY} L ${childX} ${branchStartY} L ${childX} ${branchEndY} L ${childX} ${childY}`);
            path.setAttribute('stroke', hasChild ? getLineColor(0.3) : getDashedLineColor());
            path.setAttribute('stroke-width', '2');
            path.setAttribute('fill', 'none');
            if (!hasChild) path.setAttribute('stroke-dasharray', '5,5');
            svg.appendChild(path);

            // Branch name: vertically centered to the right of the vertical branch section
            const nameLabel = document.createElement('div');
            nameLabel.className = 'branch-name';
            nameLabel.style.left = (childX + 4) + 'px';
            nameLabel.style.top = (branchStartY + (branchEndY - branchStartY) / 2 + treeSettings.vertical.branchNameOffset) + 'px';
            nameLabel.textContent = branch.name;
            nameLabel.onclick = (e) => { e.stopPropagation(); selectNode(parentNode.id); };
            canvas.appendChild(nameLabel);

            if (hasChild) {
                const showProb = (parentNode.type === 'chance' || parentNode.type === 'logic') && branch.probability !== undefined;
                const showVal = branch.value !== 0;

                // Probability on left side at bottom of vertical branch
                if (showProb) {
                    const probLabel = document.createElement('div');
                    probLabel.className = 'branch-prob';
                    probLabel.style.left = (childX - 8) + 'px';
                    probLabel.style.top = (branchEndY - treeSettings.vertical.branchValOffset) + 'px';
                    probLabel.style.transform = 'translateX(-100%)';
                    probLabel.textContent = (branch.probability || 0) + '%';
                    canvas.appendChild(probLabel);
                }

                // Value on right side at bottom of vertical branch
                if (showVal) {
                    const valLabel = document.createElement('div');
                    valLabel.className = 'branch-val';
                    valLabel.style.left = (childX + 8) + 'px';
                    valLabel.style.top = (branchEndY - treeSettings.vertical.branchValOffset) + 'px';
                    valLabel.textContent = formatValueNoUnit(branch.value);
                    canvas.appendChild(valLabel);
                }
            }

            if (!hasChild) {
                const hint = document.createElement('div');
                hint.className = 'add-node-hint';
                hint.style.left = (endX - 10) + 'px';
                hint.style.top = (endY - 10) + 'px';
                hint.textContent = '+';
                hint.onclick = (e) => { e.stopPropagation(); showAddNodeMenu(e, parentNode.id, branchIndex); };
                canvas.appendChild(hint);
            }
        }

        function renderNode(node) {
            const canvas = document.getElementById('treeCanvas');

            const marker = document.createElement('div');
            let markerClass = 'node-marker';
            if (copyMode) {
                if (copyTargetNode === node.id) {
                    markerClass += ' copy-target';
                } else if (copySourceNode === node.id) {
                    markerClass += ' copy-source';
                }
            } else if (selectedNode === node.id) {
                markerClass += ' selected';
            }
            marker.className = markerClass;
            marker.style.left = node.x + 'px';
            marker.style.top = node.y + 'px';

            // Apply end node rotation if applicable
            if (node.type === 'end') {
                const rotation = treeSettings[treeData.orientation].endnodeRotation;
                marker.style.setProperty('--rotation', `${rotation}deg`);
            }

            marker.innerHTML = shapes[node.type]();
            marker.onclick = (e) => {
                e.stopPropagation();
                if (copyMode) {
                    setTargetNode(node.id);
                } else {
                    selectNode(node.id);
                }
            };
            canvas.appendChild(marker);

            const infoDiv = document.createElement('div');

            // Position differently based on orientation
            if (treeData.orientation === 'vertical') {
                // Below node, centered horizontally
                infoDiv.style.left = (node.x + MARKER_SIZE / 2) + 'px';
                infoDiv.style.top = (node.y + MARKER_SIZE + 4) + 'px';
                infoDiv.style.transform = 'translateX(-50%)';
            } else {
                // Right of node, in horizontal layout
                infoDiv.style.left = (node.x + MARKER_SIZE + 12) + 'px';
                infoDiv.style.top = (node.y + 2) + 'px';
            }

            if (node.type === 'end') {
                const stats = calculateEndNodeStats(node.id);
                infoDiv.className = 'end-node-info';
                infoDiv.innerHTML = `
                    <div class="end-node-prob">${stats.prob.toFixed(1)} %</div>
                    <div class="end-node-value">${formatValue(stats.value, treeData.unit)}</div>
                `;
            } else {
                const ev = calculateExpectedValue(node.id);
                infoDiv.className = 'node-info';
                infoDiv.innerHTML = `
                    <div class="node-info-name">${escapeHtml(node.name)}</div>
                    <div class="node-info-value">${formatValue(ev, treeData.unit)}</div>
                `;
            }
            canvas.appendChild(infoDiv);
        }

        function renderLegend() {
            const legend = document.getElementById('legend');
            const typesInTree = new Set();
            for (const id in treeData.nodes) {
                const node = treeData.nodes[id];
                if (!node._hidden) typesInTree.add(node.type);
            }

            const typeLabels = { chance: 'Chance', decision: 'Decision', logic: 'Logic', end: 'End' };
            const legendShapes = {
                chance: `<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="url(#grad-chance)"/></svg>`,
                decision: `<svg viewBox="0 0 16 16"><polygon points="8,1 15,8 8,15 1,8" fill="url(#grad-decision)"/></svg>`,
                logic: `<svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2" fill="url(#grad-logic)"/></svg>`,
                end: `<svg viewBox="0 0 16 16"><polygon points="1,8 14,1 14,15" fill="url(#grad-end)"/></svg>`
            };

            legend.innerHTML = `
                <div class="legend-title">Node Types</div>
                <div class="legend-items">
                    ${Array.from(typesInTree).map(type => `
                        <div class="legend-item">
                            <div class="legend-shape" ${type === 'end' ? `style="transform: rotate(${treeSettings[treeData.orientation].endnodeRotation}deg)"` : ''}>${legendShapes[type]}</div>
                            ${typeLabels[type]}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // ============ ZOOM & PAN ============

        function updateTransform() {
            document.getElementById('treeCanvas').style.transform = `translate(${currentPan.x}px, ${currentPan.y}px) scale(${currentZoom})`;
        }

        function zoomIn() { currentZoom = Math.min(currentZoom * 1.2, 3); updateTransform(); }
        function zoomOut() { currentZoom = Math.max(currentZoom / 1.2, 0.3); updateTransform(); }

        function fitToView() {
            const viewport = document.getElementById('treeViewport');
            let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;

            for (const id in treeData.nodes) {
                const node = treeData.nodes[id];
                if (node._hidden) continue;
                minX = Math.min(minX, node.x);
                minY = Math.min(minY, node.y);
                maxX = Math.max(maxX, node.x + 150);
                maxY = Math.max(maxY, node.y + 60);
            }
            minX = Math.min(minX, ROOT_X);

            const treeWidth = maxX - minX + 100;
            const treeHeight = maxY - minY + 100;
            const viewWidth = viewport.clientWidth - 40;
            const viewHeight = viewport.clientHeight - 120;

            currentZoom = Math.min(Math.max(Math.min(viewWidth / treeWidth, viewHeight / treeHeight), 0.4), 1.5);
            currentPan.x = (viewWidth - treeWidth * currentZoom) / 2 - (minX - 50) * currentZoom + 20;
            currentPan.y = (viewHeight - treeHeight * currentZoom) / 2 - (minY - 50) * currentZoom + 60;
            updateTransform();
        }

        function toggleOrientation() {
            treeData.orientation = treeData.orientation === 'horizontal' ? 'vertical' : 'horizontal';
            saveCurrentProject();
            layoutTree();
            renderTree();
            requestAnimationFrame(() => setTimeout(fitToView, 100));
        }

        // ============ SELECTION & EDIT PANELS ============

        function selectNode(nodeId) {
            selectedNode = nodeId;
            selectedRootBranch = false;
            renderTree();
            showNodeEditPanel(nodeId);
        }

        function selectRootBranch() {
            selectedNode = null;
            selectedRootBranch = true;
            renderTree();
            showRootBranchEditPanel();
        }

                            <option value="logic" ${node.type === 'logic' ? 'selected' : ''}>Logic</option>
                            <option value="end" ${node.type === 'end' ? 'selected' : ''}>End</option>
                        </select>
                    </div>
                    ${statsHtml}
                `;
            }
            
            if (node.type !== 'end') {
                branchCard.style.display = copyMode ? 'none' : 'flex';
                if (!copyMode) {
                    branchCard.style.flexDirection = 'column';
                    updateBranchCard(nodeId);
                }
            } else {
                branchCard.style.display = 'none';
            }

            // Update footer buttons based on mode
            const footer = document.getElementById('nodeCardFooter');
            if (copyMode) {
                footer.innerHTML = `
                    <div id="templateNameInputSection" style="display: none; flex-direction: column; gap: 6px; padding: 10px; background: rgba(79, 70, 229, 0.1); border-radius: 6px; margin-bottom: 10px;">
                        <label style="font-size: 0.75rem; color: var(--text-secondary);">Template Name</label>
                        <input type="text" id="templateNameInput" placeholder="Enter template name" onkeydown="handleTemplateNameKeydown(event)" style="padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-card); color: var(--text-primary); font-size: 0.85rem;">
                        <div style="display: flex; gap: 6px;">
                            <button class="btn btn-cancel" onclick="cancelStoreTemplate()" style="flex: 1; padding: 4px; font-size: 0.75rem;">✕</button>
                            <button class="btn btn-confirm" onclick="confirmStoreTemplate()" style="flex: 1; padding: 4px; font-size: 0.75rem;">✓</button>
                        </div>
                    </div>
                    <div style="display: flex; gap: 6px;">
                        <button class="btn btn-copy" onclick="startStoringTemplate()" style="flex: 1; padding: 6px;">Store</button>
                        <button class="btn btn-cancel" onclick="closeEditPanel()" style="flex: 1; padding: 6px;">Cancel</button>
                        <button class="btn btn-confirm" onclick="executeCopyMode()" ${!copyTargetNode ? 'disabled' : ''} style="flex: 1; padding: 6px;">Copy</button>
                    </div>
                `;
            } else {
                footer.innerHTML = `
                    <button class="btn btn-cancel" onclick="cancelEdit()">Cancel</button>
                    <button class="btn btn-confirm" onclick="applyChanges()">Confirm</button>
                `;
            }

            panel.classList.add('visible');
        }

        function updateBranchCard(nodeId) {
            const node = treeData.nodes[nodeId];
            const branchBody = document.getElementById('branchCardBody');
            
            if (node.type === 'end' || node.branches.length === 0) {
                branchBody.innerHTML = `<div style="color:#6b7280;font-size:0.8rem;text-align:center;padding:20px;">No branches yet</div>`;
                return;
            }

            const showProb = node.type === 'chance' || node.type === 'logic';
            const showLogic = node.type === 'logic';
            
            let headers = '<th>Name</th>';
            if (showLogic) headers += '<th>Condition</th>';
            if (showProb) headers += '<th>%</th>';
            headers += '<th>Value</th><th></th>';

            const rows = node.branches.map((b, i) => {
                let cells = `<td><input type="text" class="name-input" data-row="${i}" data-col="0" value="${escapeHtml(b.name)}" onchange="updateBranchField('${nodeId}', ${i}, 'name', this.value)"></td>`;
                let colIdx = 1;
                if (showLogic) {
                    cells += `<td><input type="text" class="name-input" data-row="${i}" data-col="${colIdx}" value="${escapeHtml(b.logic || '')}" onchange="updateBranchField('${nodeId}', ${i}, 'logic', this.value)"></td>`;
                    colIdx++;
                }
                if (showProb) {
                    cells += `<td><input type="text" class="number-input" data-row="${i}" data-col="${colIdx}" value="${b.probability || 0}" onchange="updateBranchField('${nodeId}', ${i}, 'probability', this.value)"></td>`;
                    colIdx++;
                }
                cells += `<td><input type="text" class="number-input" data-row="${i}" data-col="${colIdx}" value="${b.value || 0}" onchange="updateBranchField('${nodeId}', ${i}, 'value', this.value)"></td>`;
                cells += `<td><button class="delete-btn" onclick="deleteBranch('${nodeId}', ${i})">🗑️</button></td>`;
                return `<tr>${cells}</tr>`;
            }).join('');

            let sumHtml = '';
            if (showProb) {
                const sum = node.branches.reduce((s, b) => s + (b.probability || 0), 0);
                const valid = Math.abs(sum - 100) < 0.01;
                sumHtml = `
                    <div class="branch-sum">
                        <span class="branch-sum-label">Probability Sum</span>
                        <span id="branchSumValue" class="branch-sum-value ${valid ? 'valid' : 'invalid'}">${sum.toFixed(1)} %</span>
                    </div>
                `;
            }

            branchBody.innerHTML = `
                <table class="branch-table">
                    <thead><tr>${headers}</tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                ${sumHtml}
            `;

            setupArrowKeyNavigation();
        }

        function setupArrowKeyNavigation() {
            const inputs = document.querySelectorAll('.branch-table input');
            inputs.forEach(input => {
                input.addEventListener('keydown', (e) => {
                    const row = parseInt(input.dataset.row);
                    const col = parseInt(input.dataset.col);
                    let targetRow = row, targetCol = col;

                    if (e.key === 'ArrowDown') { targetRow++; e.preventDefault(); }
                    else if (e.key === 'ArrowUp') { targetRow--; e.preventDefault(); }
                    else if (e.key === 'ArrowRight' && input.selectionStart === input.value.length) { targetCol++; e.preventDefault(); }
                    else if (e.key === 'ArrowLeft' && input.selectionStart === 0) { targetCol--; e.preventDefault(); }
                    else if (e.key === 'Tab') {
                        if (e.shiftKey) { targetCol--; } else { targetCol++; }
                        e.preventDefault();
                    }
                    else return;

                    const target = document.querySelector(`.branch-table input[data-row="${targetRow}"][data-col="${targetCol}"]`);
                    if (target) { target.focus(); target.select(); }
                });
            });
        }

        function showRootBranchEditPanel() {
            const panel = document.getElementById('editPanel');
            const nodeBody = document.getElementById('nodeCardBody');
            const branchCard = document.getElementById('branchCard');
            
            document.getElementById('nodeCardHeader').textContent = 'Root Branch Settings';
            branchCard.style.display = 'none';

            nodeBody.innerHTML = `
                <div class="form-group">
                    <label>Name (Project Title)</label>
                    <input type="text" id="rootBranchNameInput" value="${escapeHtml(treeData.rootBranch.name)}">
                </div>
                <div class="form-group">
                    <label>Unit</label>
                    <input type="text" id="unitInput" value="${escapeHtml(treeData.unit)}" placeholder="e.g. $, €, kr">
                </div>
                <div class="form-group">
                    <label>Value</label>
                    <input type="text" id="rootBranchValueInput" value="${treeData.rootBranch.value || 0}">
                </div>
            `;
            
            panel.classList.add('visible');
        }

        function cancelEdit() {
            if (copyMode) {
                exitCopyMode();
                return;
            }

            if (selectedNode && originalNodeState) {
                const node = treeData.nodes[selectedNode];

                // Restore original type and name
                node.type = originalNodeState.type;
                node.name = originalNodeState.name;

                // Restore branches if cached (from switching to end type)
                if (branchCache[selectedNode]) {
                    const cached = branchCache[selectedNode];
                    node.branches = cached.branches;
                    node.branches.forEach(b => {
                        if (b.childId) showNodeRecursive(b.childId);
                    });
                    delete branchCache[selectedNode];
                }

                // Restore original probability/logic values
                if (originalBranchProps) {
                    node.branches.forEach(branch => {
                        const original = originalBranchProps.find(o => o.id === branch.id);
                        if (original) {
                            if (original.probability !== undefined) branch.probability = original.probability;
                            else delete branch.probability;
                            if (original.logic !== undefined) branch.logic = original.logic;
                            else delete branch.logic;
                        }
                    });
                }

                delete branchPropsCache[selectedNode];
            }

            closeEditPanel();
        }

        function closeEditPanel() {
            document.getElementById('editPanel').classList.remove('visible');
            if (selectedNode) {
                delete branchPropsCache[selectedNode];
            }
            selectedNode = null;
            selectedRootBranch = false;
            originalNodeState = null;
            originalBranchProps = null;
            copyMode = false;
            copySourceNode = null;
            copyTargetNode = null;
            validCopyTargets = new Set();
            layoutTree();
            renderTree();
        }

        // ============ MENUS ============

        function showAddNodeMenu(e, parentId, branchIndex) {
            const menu = document.getElementById('contextMenu');
            menu.innerHTML = `
                <div class="context-menu-item" onclick="createNodeAtBranch('${parentId}', ${branchIndex}, 'chance'); hideContextMenu();">Chance</div>
                <div class="context-menu-item" onclick="createNodeAtBranch('${parentId}', ${branchIndex}, 'decision'); hideContextMenu();">Decision</div>
                <div class="context-menu-item" onclick="createNodeAtBranch('${parentId}', ${branchIndex}, 'logic'); hideContextMenu();">Logic</div>
                <div class="context-menu-item" onclick="createNodeAtBranch('${parentId}', ${branchIndex}, 'end'); hideContextMenu();">End</div>
            `;
            menu.style.left = e.clientX + 'px';
            menu.style.right = 'auto';
            menu.style.top = e.clientY + 'px';
            menu.classList.add('visible');
        }

        function hideContextMenu() {
            document.getElementById('contextMenu').classList.remove('visible');
        }

        // ============ IMPORT / EXPORT ============

        function exportTree() {
            const cleanData = JSON.parse(JSON.stringify(treeData));
            for (const id in cleanData.nodes) {
                if (cleanData.nodes[id]._hidden) {
                    delete cleanData.nodes[id];
                } else {
                    delete cleanData.nodes[id]._hidden;
                }
            }
            
            const blob = new Blob([JSON.stringify(cleanData, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${treeData.name.replace(/[^a-z0-9]/gi, '_')}.json`;
            a.click();
        }

        function importTree() {
            document.getElementById('importInput').click();
        }

        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    
                    // Check for duplicate project name
                    let name = imported.rootBranch ? imported.rootBranch.name : imported.name;
                    let counter = 1;
                    const baseName = name;
                    while (projects[name]) {
                        name = `${baseName} (${counter})`;
                        counter++;
                    }
                    
                    imported.name = name;
                    if (imported.rootBranch) imported.rootBranch.name = name;
                    // Ensure orientation property exists (for backward compatibility)
                    if (!imported.orientation) {
                        imported.orientation = 'horizontal';
                    }

                    treeData = imported;
                    currentProjectName = name;
                    projects[name] = JSON.parse(JSON.stringify(treeData));
                    saveProjects();
                    
                    branchCache = {};
                    branchPropsCache = {};
                    originalNodeState = null;
                    originalBranchProps = null;
                    layoutTree();
                    renderTree();
                    updateTitle();
                    setTimeout(fitToView, 100);
                } catch (err) { 
                    alert('Invalid file: ' + err.message); 
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============ DARK MODE ============

        function toggleDarkMode() {
            const isDarkMode = document.body.classList.contains('light-mode');
            if (isDarkMode) {
                document.body.classList.remove('light-mode');
                localStorage.setItem('darkMode', 'true');
                updateDarkModeToggle();
            } else {
                document.body.classList.add('light-mode');
                localStorage.setItem('darkMode', 'false');
                updateDarkModeToggle();
            }
            // Re-generate shapes with new stroke colors
            shapes = getShapes();
            // Re-render tree to update SVG colors
            layoutTree();
            renderTree();
        }

        function updateDarkModeToggle() {
            const toggle = document.getElementById('darkModeToggle');
            if (toggle) {
                const isDarkMode = document.body.classList.contains('light-mode');
                toggle.textContent = isDarkMode ? '☀️' : '🌙';
                toggle.title = isDarkMode ? 'Toggle Light Mode' : 'Toggle Dark Mode';
            }
        }

        function initDarkMode() {
            const savedMode = localStorage.getItem('darkMode');
            if (savedMode === 'false') {
                document.body.classList.add('light-mode');
            }
            updateDarkModeToggle();
        }

        // ============ EVENT LISTENERS ============

        document.addEventListener('click', (e) => {
            hideContextMenu();
            if (!e.target.closest('.project-dropdown') && !e.target.closest('.header h1')) {
                hideProjectDropdown();
            }
        });

        window.addEventListener('resize', () => setTimeout(fitToView, 100));

        // Drag to pan
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let panStartX = 0;
        let panStartY = 0;

        const viewport = document.getElementById('treeViewport');

        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.node-marker, .branch-name, .add-node-hint, .edit-panel, .context-menu')) return;
            
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            panStartX = currentPan.x;
            panStartY = currentPan.y;
            viewport.classList.add('dragging');
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;
            currentPan.x = panStartX + dx;
            currentPan.y = panStartY + dy;
            
            const canvas = document.getElementById('treeCanvas');
            canvas.style.transition = 'none';
            updateTransform();
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                viewport.classList.remove('dragging');
                const canvas = document.getElementById('treeCanvas');
                canvas.style.transition = 'transform 0.3s ease';
            }
        });

        // ============ INITIALIZATION ============

        function init() {
            initDarkMode();
            // Regenerate shapes after dark mode is initialized so strokes are correct
            shapes = getShapes();
            loadProjects();
            loadTemplates();

            const projectNames = Object.keys(projects);
            if (projectNames.length > 0) {
                loadProject(projectNames[0]);
            } else {
                createNewProject();
            }

            // fitToView is already called by loadProject, so we're all set
        }

        init();
    </script>
</body>
</html>
